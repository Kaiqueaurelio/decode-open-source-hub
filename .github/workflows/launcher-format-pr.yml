name: Prepare Decode Launcher formatting PR

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/launcher-format-pr.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: decode-launcher-format-pr
  cancel-in-progress: true

jobs:
  format-and-propose:
    name: Format imported Rust source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust formatter
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Apply rustfmt
        working-directory: launcher
        run: cargo fmt --all

      - name: Create formatting pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -Eeuo pipefail
          BRANCH="automation/decode-launcher-rustfmt-${RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add launcher
          if git diff --cached --quiet; then
            echo "Rust source is already formatted; no pull request needed."
            exit 0
          fi
          git commit -m "style(decode-launcher): apply rustfmt"
          git push origin "$BRANCH"
          gh pr create \
            --repo "$REPOSITORY" \
            --head "$BRANCH" \
            --base main \
            --title "style(decode-launcher): apply rustfmt" \
            --body "Applies the repository's stable rustfmt configuration to the imported Decode Launcher source. No intended behavior changes. The separate Decode Launcher CI workflow will check formatting and run the Rust workspace tests."
