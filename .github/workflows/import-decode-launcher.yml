name: Import Decode Launcher source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-decode-launcher.yml"
      - "scripts/import_upstream_launcher.sh"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: decode-launcher-source-import-v3
  cancel-in-progress: true

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Decode repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Import upstream source and apply first-pass branding
        run: bash scripts/import_upstream_launcher.sh

      - name: Preserve licenses and report imported project size
        run: |
          test -f launcher/LICENSE-MIT
          test -f launcher/LICENSE-APACHE
          test -f launcher/NOTICE
          test -f launcher/ATTRIBUTION.md
          echo "Imported files: $(find launcher -type f | wc -l)"
          echo "Imported source size: $(du -sh launcher | cut -f1)"

      - name: Apply Rust formatting
        working-directory: launcher
        run: cargo fmt --all

      - name: Run Rust tests
        working-directory: launcher
        run: cargo test --workspace

      - name: Create migration branch and pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          BRANCH="automation/decode-launcher-source-import"
          git checkout -B "$BRANCH"
          git add launcher
          if ! git diff --cached --quiet; then
            git commit -m "Import upstream launcher source for Decode branding"
            git push --force-with-lease origin "$BRANCH"
          else
            echo "Working tree clean; no new changes to commit."
          fi
          if gh pr view "$BRANCH" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Pull request already exists for $BRANCH"
          else
            gh pr create \
              --repo "$REPOSITORY" \
              --head "$BRANCH" \
              --base main \
              --title "Import upstream launcher source for Decode" \
              --body "Imports the upstream Rust launcher and assets into launcher/ with first-pass Decode branding. Upstream license and attribution notices are preserved."
          fi
