name: Decode Launcher Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libasound2-dev libudev-dev libfontconfig1-dev libwayland-dev
      - name: Build Launcher Release
        run: cd launcher && cargo build --release --bin decode-launcher
      - name: Package Linux Binary
        run: |
          mkdir -p dist
          cp launcher/target/release/decode-launcher dist/
          tar -czvf dist/decode-launcher-linux-x86_64.tar.gz -C dist decode-launcher
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/decode-launcher-linux-x86_64.tar.gz
