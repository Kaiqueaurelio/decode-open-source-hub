name: Build DecodeCAD (canonical repository)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/**'
      - 'xtask/**'
      - 'assets/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/**'
      - 'xtask/**'
      - 'assets/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep builds traceable per commit. A later documentation-only commit must not cancel
# an active multi-platform build for an earlier code commit.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cadcraft-linux-x86_64
            binary: target/release/cadcraft
          - os: windows-latest
            artifact: cadcraft-windows-x86_64
            binary: target/release/cadcraft.exe
          - os: macos-latest
            artifact: cadcraft-macos
            binary: target/release/cadcraft

    steps:
      - name: Check out canonical DecodeCAD source
        uses: actions/checkout@v4
        with:
          repository: Kaiqueaurelio/decodecad
          ref: main
          path: decodecad

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers libgl1-mesa-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build desktop executable
        working-directory: decodecad
        run: cargo build --locked --release -p cadcraft

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "decodecad/${{ matrix.binary }}" dist/
          cp decodecad/README.md dist/README-decodecad.md
          cp decodecad/README-FORK.md dist/README-fork.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
